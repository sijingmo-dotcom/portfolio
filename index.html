<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="个人视觉作品集：动态影像、产品广告、品牌与平面设计。"><title>个人视觉作品集 · PORTFOLIO</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/daylight.css"></head><body>
<header class="topbar"><nav class="hero-nav" aria-label="首页导航"><button data-hero-section="about">个人介绍</button><button data-hero-section="strengths">个人优势</button><button data-hero-section="works">精选作品</button><button id="editToggle" class="subtle">编辑作品集 <span>↗</span></button></nav></header>
<main>
<section id="hero" class="hero"><div class="hero-camera" aria-hidden="true"><div class="hero-art"></div></div><div class="hero-shade"></div><button id="replayIntro" class="replay-intro" aria-label="重播开屏动画">↺</button></section>
<section id="studio" class="studio" hidden><nav class="section-nav" aria-label="作品集导航"><button data-section="about" class="active"><span>个人介绍</span></button><button data-section="strengths"><span>个人优势</span></button><button data-section="works"><span>精选作品</span></button><button id="editFromNav" class="close-studio" aria-label="编辑内容">编辑</button><button data-home aria-label="收起内容">收起 ×</button></nav>
<div id="about" class="section"><div class="section-heading"><p class="eyebrow">ABOUT ME</p><h2>设计是我与<br>世界的对话。</h2></div><div class="about-grid"><div class="portrait" id="portrait"></div><div class="bio"><p class="eyebrow">HELLO, I'M</p><h3 id="name"></h3><p id="role" class="muted"></p><p id="bio"></p><div id="contacts" class="contacts"></div></div><div class="skills"><p class="eyebrow">MY TOOLKIT / 技能</p><div id="skillList"></div></div></div></div>
<div id="strengths" class="section"><div class="section-heading split"><div><p class="eyebrow">MY APPROACH</p><h2>好的创意，<br>也需要好的实现。</h2></div><p class="section-aside">从第一笔灵感<br>到最后一帧细节。</p></div><div id="strengthList" class="strength-grid"></div></div>
<div id="works" class="section works-section"><div class="section-heading split"><div><p class="eyebrow">SELECTED WORK</p><h2>精选作品</h2></div><span class="section-aside">A SELECTION OF IDEAS<br>BROUGHT TO LIFE.</span></div><div class="filters" id="filters" role="group" aria-label="作品分类"></div><div id="workGrid" class="work-grid"></div><p class="empty" id="emptyWorks" hidden>这个分类还没有作品，点击「编辑作品集」添加。</p></div>
<footer><span class="footer-mark">Make it<br><i>mean something.</i></span><div><span id="footerName"></span><p>视觉 · 动态 · 想象</p></div></footer></section>
</main>
<dialog id="detail" class="detail"><div class="detail-top"><button id="backWork" class="subtle">← 返回作品</button><span id="detailCategory"></span><button id="closeDetail" class="icon" aria-label="关闭作品详情">×</button></div><div class="detail-content"><div id="detailMedia"></div></div><div class="detail-end"><button id="backBottom">← 回到刚才的位置</button></div></dialog>
<dialog id="editor" class="editor"><div class="editor-head"><div><p class="eyebrow">YOUR CREATIVE SPACE</p><h2>编辑作品集</h2></div><button id="closeEditor" class="icon" aria-label="关闭编辑器">×</button></div><p class="editor-intro">修改后可即时预览。点击保存，将内容与上传文件保存在本机作品集文件夹。</p><div class="editor-tabs"><button data-edit-tab="profile" class="active">个人介绍</button><button data-edit-tab="strengths">个人优势</button><button data-edit-tab="works">精选作品</button><button data-edit-tab="theme">主题外观</button><button data-edit-tab="text">页面文字</button><button data-edit-tab="font">字体</button></div><form id="editForm"></form><div class="editor-foot"><span id="saveStatus" role="status">尚未修改</span><button id="previewEdit" class="subtle">预览</button><button id="saveEdit" class="primary">保存更改</button></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><script src="/app.js" defer></script></body></html>
